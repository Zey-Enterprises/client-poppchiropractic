---
layout: default
---
<section class="wrap reading archive">
  <h1 data-archive-title>{{ page.title | escape }}</h1>
  <p class="lede">{{ page.description | escape }}</p>
  <p><a href="{{ '/knowledge/' | relative_url }}">Knowledge base</a></p>
  <form class="archive-filters" hidden>
    <label>Content type
      <select name="kind"><option value="articles">Articles</option><option value="all">All posts</option><option value="video">Videos</option></select>
    </label>
    <label>Category
      <select name="category">
        <option value="">All categories</option>
        {% assign categories = site.categories | sort %}
        {% for group in categories %}<option>{{ group[0] | escape }}</option>{% endfor %}
      </select>
    </label>
    <label>Tag
      <select name="tag">
        <option value="">All tags</option>
        {% assign tags = site.tags | sort %}
        {% for group in tags %}<option>{{ group[0] | escape }}</option>{% endfor %}
      </select>
    </label>
    <label>Publication month
      <select name="month"><option value="">All months</option></select>
    </label>
    <a href="{{ page.url | relative_url }}">Clear filters</a>
  </form>
  <p id="archive-status" role="status"></p>
  {% include article-list.html posts=site.posts filterable=true %}
  <noscript><p><a href="{{ '/knowledge/videos/' | relative_url }}">Browse instructional videos</a></p></noscript>
  <nav class="archive-pagination" aria-label="Archive pages" hidden></nav>
</section>
<script defer src="{{ '/assets/js/archive.js' | relative_url }}"></script>

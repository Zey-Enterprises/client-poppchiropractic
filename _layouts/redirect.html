<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{% assign destination = page.redirect_to | relative_url %}
<meta http-equiv="refresh" content="0;url={{ destination | escape }}">
<link rel="canonical" href="{{ page.redirect_to | absolute_url | escape }}">
<title>Page moved | {{ site.title }}</title>
</head>
<body>
<main><h1>Page moved</h1><p><a id="destination" href="{{ destination | escape }}">Continue to the new page</a></p></main>
<script>
  const target = new URL(document.getElementById('destination').href);
  {% if page.redirect_preserve_query %}if (!target.search) target.search = location.search;{% endif %}
  if (!target.hash && location.hash) target.hash = location.hash;
  location.replace(target.href);
</script>
</body>
</html>
